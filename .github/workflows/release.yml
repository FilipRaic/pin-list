name: Release

# Push a tag like v2.1.0 (on a commit that is on master) to build every app and publish a GitHub release.
# The commit and the tag can be pushed together: the release waits for the Build workflow of that commit and
# builds nothing unless it passed (tests, coverage, all three apps). So this workflow doesn't run the tests again.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write
  actions: read   # to see the Build run of the tagged commit

# Every job and test step has a time limit, so a hang fails in minutes instead of running for hours
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # most of it is waiting for the Build run below
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, needed for the master check below

      - name: Make sure the tag points to a commit on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on master - no release is created."
            exit 1
          fi

      - name: Make sure the tag matches the version in Version.props
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -oP '(?<=<Version>)[^<]+' Version.props | head -1)
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag doesn't match <Version>$version</Version> in Version.props. Update it (and CHANGELOG.md) first."
            exit 1
          fi

      - name: Make sure CHANGELOG.md has an entry for this version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! awk -v h="## [$tag]" 'index($0, h) == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$tag]' section - the release notes come from it."
            exit 1
          fi

      # After a failed Build: if it failed by chance, re-run the Build, then "Re-run failed jobs" here (the tag stays).
      # If it needs a fix, commit it and move the tag: git tag -f vX.Y.Z, then git push -f origin vX.Y.Z.
      - name: Wait for the Build of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 40 * 60))
          appeared=$((SECONDS + 5 * 60))
          while true; do
            # the newest Build of this commit from a push or started by hand (pull request runs don't count)
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --commit "$GITHUB_SHA" \
              --limit 20 --json event,status,conclusion,url \
              --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0] // empty')
            if [ -z "$run" ]; then
              if [ $SECONDS -ge $appeared ]; then
                echo "::error::No Build ran for this exact commit (only the last commit of a push is built). Start one in Actions > Build > Run workflow on master, then re-run this release."
                exit 1
              fi
            elif [ "$(jq -r .status <<< "$run")" = "completed" ]; then
              conclusion=$(jq -r .conclusion <<< "$run")
              if [ "$conclusion" = "success" ]; then
                echo "The Build of this commit passed: $(jq -r .url <<< "$run")"
                exit 0
              fi
              echo "::error::The Build of this commit ended with '$conclusion' ($(jq -r .url <<< "$run")). Fix it and re-run this release."
              exit 1
            fi
            if [ $SECONDS -ge $deadline ]; then
              echo "::error::The Build of this commit didn't finish within 40 minutes."
              exit 1
            fi
            sleep 30
          done

  windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Google sign-in for sync (see GOOGLE-REQUIREMENTS.md): the Desktop client ID goes into the app.
      # The file is written only here, from the repository secrets, and is never committed.
      - name: Add the Google client ID
        shell: pwsh
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if (-not $env:GOOGLE_CLIENT_ID -or -not $env:GOOGLE_CLIENT_SECRET) {
            Write-Output "::error::The GOOGLE_CLIENT_ID or GOOGLE_CLIENT_SECRET secret is missing - see GOOGLE-REQUIREMENTS.md."
            exit 1
          }
          @{ clientId = $env:GOOGLE_CLIENT_ID; clientSecret = $env:GOOGLE_CLIENT_SECRET } |
            ConvertTo-Json | Set-Content src/PinList/google-client.json -Encoding utf8NoBOM

      - name: Publish
        shell: pwsh
        run: |
          # Single-file exe; needs the .NET 10 Desktop Runtime on the user's PC (WinForms is used for the tray icon).
          # Avalonia's native libraries (Skia, HarfBuzz) go inside the exe and are unpacked on first start.
          dotnet publish src/PinList/PinList.csproj -c Release -f net10.0-windows -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out

          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item out/PinList.exe release/PinList.exe

          # Checksum file, so downloads can be verified (see README)
          $hash = (Get-FileHash release/PinList.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  PinList.exe" | Out-File release/PinList.exe.sha256 -Encoding ascii -NoNewline

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*

  mac:
    needs: check
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Google sign-in for sync (see GOOGLE-REQUIREMENTS.md): the Desktop client ID goes into the app.
      # The file is written only here, from the repository secrets, and is never committed.
      - name: Add the Google client ID
        shell: pwsh
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if (-not $env:GOOGLE_CLIENT_ID -or -not $env:GOOGLE_CLIENT_SECRET) {
            Write-Output "::error::The GOOGLE_CLIENT_ID or GOOGLE_CLIENT_SECRET secret is missing - see GOOGLE-REQUIREMENTS.md."
            exit 1
          }
          @{ clientId = $env:GOOGLE_CLIENT_ID; clientSecret = $env:GOOGLE_CLIENT_SECRET } |
            ConvertTo-Json | Set-Content src/PinList/google-client.json -Encoding utf8NoBOM

      - name: Build PinList.app
        run: |
          bash scripts/package-mac.sh "${GITHUB_REF_NAME#v}" release
          cd release && shasum -a 256 PinList-mac-arm64.zip > PinList-mac-arm64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: release/*

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install the .NET Android workload
        run: dotnet workload install android

      # Every release must be signed with the same key, or phones refuse to update the app.
      # The key lives in the repository secrets (see "Releasing a new version" in the README).
      - name: Build the APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing - see the README."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pinlist.keystore"
          dotnet publish src/PinList.Android/PinList.Android.csproj -c Release -f net10.0-android -o out \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/pinlist.keystore" \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD \
            -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD
          rm "$RUNNER_TEMP/pinlist.keystore"

          mkdir -p release
          cp out/com.pinlist.app-Signed.apk release/PinList-android.apk
          cd release && sha256sum PinList-android.apk > PinList-android.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/*

  publish:
    needs: [ windows, mac, android ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Release notes from CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # The version's section, without its heading; links to repo files point at this tag
          awk -v h="## [$tag]" 'index($0, h) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md \
            | sed -E "s#\]\((docs/|README\.md|CHANGELOG\.md)#](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/\1#g" \
            > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          # Every app and its checksum, by name: the release fails instead of going out with a file missing
          files: |
            release/PinList.exe
            release/PinList.exe.sha256
            release/PinList-mac-arm64.zip
            release/PinList-mac-arm64.zip.sha256
            release/PinList-android.apk
            release/PinList-android.apk.sha256
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/release-notes.md
