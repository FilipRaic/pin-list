name: Release

# Push a tag like v1.1.0 to build the exe and publish a GitHub release.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $project = "src/PinList/PinList.csproj"

          # Single-file exe; needs the .NET 10 Desktop Runtime on the user's PC
          dotnet publish $project -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -p:Version=$version -o out

          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item out/PinList.exe release/PinList.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
