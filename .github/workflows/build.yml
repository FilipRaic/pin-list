name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Read-only token: this workflow only compiles and tests the code.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Warnings fail the build here, so they get fixed before they pile up
      - name: Build
        run: dotnet build PinList.sln -c Release -warnaserror

      # The UI tests run the real app on a hidden desktop. The build fails if coverage drops
      # below 99 % of lines or 92 % of branches (Release builds count branches a little differently).
      - name: Test
        run: >
          dotnet test PinList.sln -c Release --no-build
          -p:CollectCoverage=true -p:ExcludeByFile=**/obj/**
          -p:Threshold=99%2c92 -p:ThresholdType=line%2cbranch -p:ThresholdStat=total
