# Opens pull requests when the GitHub Actions or the test packages have new versions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: nuget
    directory: /tests/PinList.Tests
    schedule:
      interval: monthly
    groups:
      test-packages:
        patterns: [ "*" ]
    ignore:
      # xUnit v3 4.x only runs with Microsoft's new test runner (Microsoft.Testing.Platform). Moving to it changes
      # both test projects, the coverage tool and the CI test commands, so it's done on purpose, not by Dependabot.
      - dependency-name: "xunit.v3"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "xunit.runner.visualstudio"
        update-types: [ "version-update:semver-major" ]
