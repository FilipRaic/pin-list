# Opens pull requests when the GitHub Actions, Avalonia or the test packages have new versions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # all action updates in one pull request (and one Build run) a month
    groups:
      actions:
        patterns: [ "*" ]

  - package-ecosystem: nuget
    # every project that references Avalonia, so all its packages move to the same version together
    directories:
      - /src/PinList
      - /src/PinList.UI
      - /src/PinList.Android
      - /tests/PinList.Tests
    schedule:
      interval: monthly
    # only Avalonia and the test packages, the Android Google and AndroidX packages are updated by hand
    allow:
      - dependency-name: "Avalonia*"
      - dependency-name: "xunit*"
      - dependency-name: "Microsoft.NET.Test.Sdk"
      - dependency-name: "coverlet*"
    groups:
      avalonia:
        patterns: [ "Avalonia*" ]
      test-packages:
        patterns: [ "*" ]
    ignore:
      # xUnit v3 4.x only runs with Microsoft's new test runner (Microsoft.Testing.Platform). Moving to it changes
      # both test projects, the coverage tool and the CI test commands, so it's done on purpose, not by Dependabot.
      - dependency-name: "xunit.v3"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "xunit.runner.visualstudio"
        update-types: [ "version-update:semver-major" ]
